
<th:block th:fragment="contact-section">
    <section id="contact" class="contact-section">
        <div class="container">
            <div class="contact-grid">

                <!-- LEFT SIDE: Contact Info -->
                <div class="contact-info-side">
                    <h2 class="section-title">Let's Build Something <span>Amazing Together</span></h2>
                    <p class="contact-desc">I'm always open to discussing new projects, creative ideas or opportunities to be part of your vision.</p>

                    <div class="info-cards">
                        <!-- Email Card -->
                        <div class="info-card">
                            <div class="icon-circle">
                                <svg class="contact-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                            </div>
                            <div class="info-details">
                                <span>Email</span>
                                <div class="email-wrapper">
                                    <a href="mailto:jeromemorales.0421@gmail.com" class="email-link">jeromemorales.0421@gmail.com</a>
                                    <button class="copy-btn" onclick="copyEmail()">
                                        <svg id="copy-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px; height:16px;"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- LinkedIn Card -->
                        <a href="https://www.linkedin.com/in/jerome-morales-2823a3262/?locale=en" target="_blank" class="info-card">
                            <div class="icon-circle">
                                <svg class="contact-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path><rect x="2" y="9" width="4" height="12"></rect><circle cx="4" cy="4" r="2"></circle></svg>
                            </div>
                            <div class="info-details">
                                <span>LinkedIn</span>
                                <p>Jerome Morales</p>
                            </div>
                        </a>
                    </div>
                </div>

                <!-- RIGHT SIDE: The Actual Form (RE-ADDED) -->

                <div class="contact-form-card">
                    <!-- Using your specific Formspree ID -->
                    <form action="https://formspree.io/f/xlgzlkwv" method="POST" id="contact-form">
                        <div class="input-group">
                            <label for="name">Your Name</label>
                            <input type="text" id="name" name="name" placeholder="John Doe" required>
                        </div>

                        <div class="input-group">
                            <label for="email">Your Email</label>
                            <input type="email" id="email" name="email" placeholder="Your Email" required>
                        </div>

                        <div class="input-group">
                            <label for="message">Your Message</label>
                            <textarea id="message" name="message" placeholder="Your Message" required></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary btn-send">Send Message</button>
                    </form>
                </div>





            </div>
        </div>
    </section>
</th:block>
